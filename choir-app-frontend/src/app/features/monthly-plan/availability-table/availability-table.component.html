<!-- Desktop: Table View -->
<div class="desktop-view">
  <mat-table [dataSource]="availabilities" class="mat-elevation-z2">
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef>Datum</mat-header-cell>
      <mat-cell *matCellDef="let a">
        {{ a.date | pureDate | date:'EEE dd.MM.yyyy':'Europe/Berlin':'de-DE' }}
        <span class="holiday" *ngIf="a.holidayHint"> ({{ a.holidayHint }})</span>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="notes">
      <mat-header-cell *matHeaderCellDef>Notiz</mat-header-cell>
      <mat-cell *matCellDef="let a" class="notes-cell">
        <span class="note-text" *ngIf="hasNote(a.date); else noNoteDesktop">{{ noteForDate(a.date) }}</span>
        <ng-template #noNoteDesktop>—</ng-template>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Verfügbarkeit</mat-header-cell>
      <mat-cell *matCellDef="let a" class="status-cell">
        <div class="status-toggle-group" role="group" [attr.aria-label]="'Verfügbarkeit für ' + (a.date | pureDate | date:'EEE dd.MM.yyyy':'Europe/Berlin':'de-DE')">
          <button
            *ngFor="let option of statusOptions"
            type="button"
            class="status-toggle"
            [ngClass]="'status-toggle--' + option.className"
            [class.status-toggle--active]="isActiveStatus(a.date, option.value)"
            [disabled]="isSaving"
            [attr.aria-pressed]="isActiveStatus(a.date, option.value)"
            [attr.aria-label]="buttonAriaLabel(option.value, a.date)"
            (click)="setStatus(a.date, option.value)">
            {{ option.label }}
          </button>
        </div>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    <ng-container matNoDataRow>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Keine Ereignisse vorhanden.
        </td>
      </tr>
    </ng-container>
  </mat-table>
</div>

<!-- Mobile: Card View -->
<div class="mobile-view">
  <div class="availability-cards" *ngIf="availabilities.length > 0; else mobileNoData">
    <div class="availability-card" *ngFor="let a of availabilities; trackBy: trackByDate"
         [ngClass]="'card-' + statusClass(a.status)"
         role="article"
         [attr.aria-label]="(a.date | pureDate | date:'fullDate':'Europe/Berlin':'de-DE')">
      <div class="card-date-row">
        <span class="card-date-text">{{ a.date | pureDate | date:'EEE dd.MM.yyyy':'Europe/Berlin':'de-DE' }}</span>
        <span class="card-holiday" *ngIf="a.holidayHint">{{ a.holidayHint }}</span>
        <span class="card-note" *ngIf="hasNote(a.date)">{{ noteForDate(a.date) }}</span>
      </div>
      <div class="status-toggle-group status-toggle-group--mobile" role="group" [attr.aria-label]="'Verfügbarkeit für ' + (a.date | pureDate | date:'fullDate':'Europe/Berlin':'de-DE')">
        <button
          *ngFor="let option of statusOptions"
          type="button"
          class="status-toggle"
          [ngClass]="'status-toggle--' + option.className"
          [class.status-toggle--active]="isActiveStatus(a.date, option.value)"
          [disabled]="isSaving"
          [attr.aria-pressed]="isActiveStatus(a.date, option.value)"
          [attr.aria-label]="buttonAriaLabel(option.value, a.date)"
          (click)="setStatus(a.date, option.value)">
          {{ option.label }}
        </button>
      </div>
    </div>
  </div>
  <ng-template #mobileNoData>
    <app-empty-state icon="event_busy" message="Keine Ereignisse vorhanden."></app-empty-state>
  </ng-template>
</div>
