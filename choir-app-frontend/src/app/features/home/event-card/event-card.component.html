<mat-card>
  <mat-card-header>
    <mat-card-title>{{ cardTitle }}</mat-card-title>
    <button *ngIf="canEdit && event" mat-icon-button type="button" (click)="editEvent()"
      matTooltip="Termin bearbeiten" aria-label="Termin bearbeiten">
      <mat-icon>edit</mat-icon>
    </button>
    <button *ngIf="event?.pieces?.length" mat-icon-button (click)="copyPieceList()" matTooltip="Liste kopieren" aria-label="Stückliste kopieren">
      <mat-icon>content_copy</mat-icon>
    </button>
  </mat-card-header>
  <mat-card-content>
    <!-- Überprüfen Sie, ob ein Event-Objekt übergeben wurde -->
    <ng-container *ngIf="event; else noData">
      <h3>
        {{ event.date | pureDate | date:'fullDate':'Europe/Berlin':'de-DE' }}
        <span class="event-creator" *ngIf="event.director">({{ event.director.name }})</span>
      </h3>
      <div class="availability-section" *ngIf="allowAvailabilityActions">
        <div class="availability-section__label">Meine Rückmeldung</div>
        <app-availability-control
          [date]="event.date"
          [choirId]="choirId ?? event.choirId"
          [status]="availabilityStatus"
          [showSummary]="true"
          labelTarget="Termin"
          (statusChange)="onAvailabilityChange($event)">
        </app-availability-control>
      </div>
      <ng-container *ngIf="event.pieces && event.pieces.length > 0; else noteBlock">
        <mat-list>
          <mat-list-item *ngFor="let piece of event.pieces">
            <div matListItemTitle>
              <a [routerLink]="['/pieces', piece.id]" class="piece-link">
                {{getPieceReference(piece)}} {{ piece.title }}
              </a>
            </div>
            <div matListItemLine>
                <span>{{ getPieceSubtitle(piece) }}</span>
            </div>
          </mat-list-item>
        </mat-list>
      </ng-container>
      <ng-template #noteBlock>
        <div *ngIf="event.notes" class="event-note">
          {{ event.notes }}
        </div>
      </ng-template>
    </ng-container>

    <!-- Diese Vorlage wird angezeigt, wenn das 'event'-Input null ist -->
    <ng-template #noData>
      <div class="no-data-message">
        <p>Für diese Karte ist noch kein Termin vorhanden.</p>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
