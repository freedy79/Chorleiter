<mat-card>
  <mat-card-content>
    <div class="donations-header">
      <h2>Spenden</h2>
      <div class="header-actions">
        <button mat-icon-button (click)="openPayPalSettings()"
                matTooltip="PayPal PDT Einstellungen"
                aria-label="PayPal Einstellungen">
          <mat-icon>settings</mat-icon>
        </button>
        <button mat-raised-button color="primary" (click)="toggleAddForm()">
          {{ isAddingDonation ? 'Abbrechen' : 'Spende hinzufügen' }}
        </button>
      </div>
    </div>

    <div *ngIf="isAddingDonation" class="add-donation-form">
      <h3>Neue Spende erfassen</h3>
      <div class="donation-form-grid">
        <mat-form-field class="user-field">
          <mat-label>Benutzer</mat-label>
          <mat-select [(ngModel)]="selectedUserId">
            <mat-option *ngFor="let user of users" [value]="user.id">
              {{ user.firstName }} {{ user.name }} ({{ user.email }})
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field class="amount-field">
          <mat-label>Betrag (€)</mat-label>
          <input matInput type="number" [(ngModel)]="amount" placeholder="0.00" step="0.01" min="0">
        </mat-form-field>

        <mat-form-field class="date-field">
          <mat-label>Datum</mat-label>
          <input matInput type="date" [(ngModel)]="donatedAt">
        </mat-form-field>

        <button mat-raised-button color="accent" (click)="addDonation()"
                [disabled]="!selectedUserId || !amount"
                class="save-button">
          Speichern
        </button>
      </div>
    </div>

    <ng-container *ngIf="donations.length; else donationsEmptyState">
      <table mat-table [dataSource]="donations" class="mat-elevation-z8 donations-table">
        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef>Benutzer</th>
          <td mat-cell *matCellDef="let d">{{ d.user?.firstName }} {{ d.user?.name }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Datum</th>
          <td mat-cell *matCellDef="let d">{{ d.donatedAt | date:'short' }}</td>
        </ng-container>
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Betrag</th>
          <td mat-cell *matCellDef="let d">{{ d.amount | number:'1.2-2' }} €</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </ng-container>

    <ng-template #donationsEmptyState>
      <app-empty-state
        icon="volunteer_activism"
        title="Noch keine Spenden erfasst"
        message="Lege über „Spende hinzufügen“ den ersten Eintrag an.">
      </app-empty-state>
    </ng-template>
  </mat-card-content>
</mat-card>
