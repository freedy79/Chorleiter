<div class="admin-launchpad">
  <header class="launchpad-header">
    <h1>Admin Dashboard</h1>
    <p class="subtitle">Zentrale Verwaltung aller Administratoraufgaben</p>
  </header>

  <app-admin-status-widget></app-admin-status-widget>

  <section class="launchpad-group" *ngFor="let group of groups">
    <h2 class="group-title">{{ group.label }}</h2>
    <div class="cards-grid">
      <mat-card
        *ngFor="let item of group.items"
        class="admin-card"
        role="button"
        tabindex="0"
        [attr.aria-label]="item.label + ': ' + item.description"
        (click)="navigate(item)"
        (keyup.enter)="navigate(item)"
        (keyup.space)="navigate(item)"
      >
        <div class="card-icon">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
        <div class="card-body">
          <h3>{{ item.label }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </mat-card>
    </div>
  </section>
</div>
