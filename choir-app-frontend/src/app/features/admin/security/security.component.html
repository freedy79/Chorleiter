<div class="security">
  <app-admin-page-header
    title="Sicherheit & Monitoring"
    description="Login-Versuche, Protokolle und Systemstatus">
  </app-admin-page-header>

  <div class="mobile-tab-selector" *ngIf="isMobile$ | async">
    <mat-form-field appearance="outline" class="tab-select-field">
      <mat-label>Unterbereich</mat-label>
      <mat-select
        [value]="selectedTabIndex"
        (selectionChange)="onSelectedTabIndexChange($any($event.value))">
        <mat-option *ngFor="let tab of tabs; let i = index" [value]="i">
          <span class="mobile-option-content">
            <mat-icon>{{ tab.icon }}</mat-icon>
            <span>{{ tab.mobileLabel || tab.label }}</span>
          </span>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-tab-group class="hub-tab-group" (selectedTabChange)="onTabChange($event)" [selectedIndex]="selectedTabIndex">

    <!-- Login-Versuche Tab -->
    <mat-tab label="Login-Versuche">
      <ng-template mat-tab-label>
        <mat-icon matTabLabelPadding>login</mat-icon>
        <span class="tab-label">Login</span>
      </ng-template>
      <div class="tab-content">
        <app-login-attempts></app-login-attempts>
      </div>
    </mat-tab>

    <!-- Protokolle Tab -->
    <mat-tab label="Protokolle">
      <ng-template mat-tab-label>
        <mat-icon matTabLabelPadding>history</mat-icon>
        <span class="tab-label">Protokolle</span>
      </ng-template>
      <div class="tab-content">
        <app-protocols></app-protocols>
      </div>
    </mat-tab>

    <!-- Log-Viewer Tab -->
    <mat-tab label="System-Logs">
      <ng-template mat-tab-label>
        <mat-icon matTabLabelPadding>receipt_long</mat-icon>
        <span class="tab-label">Logs</span>
      </ng-template>
      <div class="tab-content">
        <app-log-viewer></app-log-viewer>
      </div>
    </mat-tab>

    <!-- OTA Tokens Tab -->
    <mat-tab label="Zugangstoken">
      <ng-template mat-tab-label>
        <mat-icon matTabLabelPadding>vpn_key</mat-icon>
        <span class="tab-label">Zugangstoken</span>
      </ng-template>
      <div class="tab-content">
        <app-ota-tokens></app-ota-tokens>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
