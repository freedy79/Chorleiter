<div class="actions" *ngIf="isChoirAdmin || isAdmin || isDirector">
  <button mat-flat-button color="primary" (click)="addPost()">Neuer Beitrag</button>
</div>

<app-data-state
  [isLoading]="isLoading"
  [hasError]="hasLoadError"
  [errorTitle]="'Fehler beim Laden der Beiträge'"
  [errorMessage]="loadErrorMessage"
  [isEmpty]="!isLoading && !hasLoadError && posts.length === 0"
  emptyIcon="article"
  emptyTitle="Noch keine Beiträge"
  emptyMessage="Noch keine Beiträge angelegt."
  (retry)="loadPosts()"
>
  <ng-container empty-actions>
    <button *ngIf="isChoirAdmin || isAdmin || isDirector" mat-flat-button color="primary" (click)="addPost()">
      <mat-icon>add</mat-icon>
      Ersten Beitrag erstellen
    </button>
  </ng-container>

  <div class="post-list">
    <ng-container *ngFor="let p of posts | slice:0:displayCount">
      <app-post
        [post]="p"
        [currentUserId]="currentUserId"
        [isChoirAdmin]="isChoirAdmin"
        [isAdmin]="isAdmin"
        (postEdited)="onPostEdited($event)"
        (postDeleted)="onPostDeleted($event)"
        (postPublished)="onPostPublished()"
      ></app-post>
    </ng-container>
    <div class="load-more" *ngIf="displayCount < posts.length">
      <a (click)="showMore()">Ältere anzeigen</a>
    </div>
  </div>
</app-data-state>
